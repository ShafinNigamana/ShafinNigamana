name: Generate Contribution Animations

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows manual runs from the Actions tab
  workflow_dispatch:
  
  # Run on push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generate SVGs based on your github contributions
      - name: Generate Contribution SVGs
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/pacman-contribution-graph.svg?palette=pacman
            dist/pacman-contribution-graph-dark.svg?palette=pacman&color_snake=purple
          
      # Deploy generated files to the "output" branch
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
